name: Build Images for GC (new workflow)
permissions:
  contents: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Build from Github Actions
        type: environment
        default: build
      build:
        description: build docker images
        required: true
        type: boolean
        default: true
      trivy_scan:
        description: "Run Trivy Scan"
        required: true
        type: boolean
        default: true
      twistlock_scan:
        description: "Run Twistlock Scan"
        required: true
        type: boolean
        default: true
run-name: "Build Docker Images for GC"

jobs:

  # ──────────────────────────────────────────────
  # Job 1: Compute the image tag once, share it
  # ──────────────────────────────────────────────
  prepare:
    name: Prepare Image Tag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set_tag.outputs.image_tag }}
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          submodules: recursive
          clean: true
          fetch-depth: 0

      - name: Extract branch name and set image tag
        id: set_tag
        run: |
          BRANCH_NAME=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
          echo "Current branch is: $BRANCH_NAME"
          git fetch --tags --force --quiet
          #tag=$(git tag -l $BRANCH_NAME* | sort -V | tail -1)
          tag=$(git ls-remote --tags origin "$BRANCH_NAME.*" \
            | awk '{print $2}' \
            | sed 's|refs/tags/||' \
            | sort -V \
            | tail -1)
          echo "Latest git tag: $tag" 
          if [ ! -z "$tag" ]; then
            build_num=$(echo "${tag##*.}")
            build_num=$((build_num+1))
          else
            build_num=1
          fi
          IMAGE_TAG="$BRANCH_NAME.$build_num"
          echo "IMAGE_TAG=$IMAGE_TAG"

          # Tag the commit immediately so the next run always sees it, even if the build fails
          git config user.name "GitHub Actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag $IMAGE_TAG
          git push origin $IMAGE_TAG

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────
  # Job 2: Build + Trivy scan + Push each image in parallel
  # ──────────────────────────────────────────────
  build:
    name: Build, Scan and Push - ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: prepare
    environment: ${{ inputs.environment }}
    env:
      IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
      REGION: "us-east-1"
    strategy:
      fail-fast: false   # let all matrix jobs run even if one fails
      matrix:
        include:
          - name: backend
            ecr_repo: crdc-gen-backend
            dockerfile: backend/Dockerfile
            context: backend
          - name: frontend
            ecr_repo: crdc-gen-frontend
            dockerfile: frontend/Dockerfile
            context: frontend
          - name: interoperation
            ecr_repo: crdc-gen-interoperation
            dockerfile: interoperation/Dockerfile
            context: interoperation

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          submodules: true

      - name: Set image name
        run: |
          echo "IMAGE_NAME=${{ secrets.AWS_ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ matrix.ecr_repo }}:${{ env.IMAGE_TAG }}" >> $GITHUB_ENV

      - name: Build Docker Image
        run: |
          docker build --no-cache \
            -t $IMAGE_NAME \
            -f ${{ matrix.dockerfile }} \
            ${{ matrix.context }}

      - name: Run Trivy Scan
        if: ${{ inputs.trivy_scan == true }}
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          echo "========================================"
          echo "Scanning: $IMAGE_NAME"
          echo "========================================"
          trivy image \
            --exit-code 0 \
            --severity CRITICAL,HIGH,MEDIUM \
            --no-progress \
            --format table \
            "$IMAGE_NAME"

          trivy image \
            --exit-code 0 \
            --severity CRITICAL,HIGH,MEDIUM \
            --no-progress \
            --format json \
            --output "trivy-${{ matrix.name }}.json" \
            "$IMAGE_NAME"

      - name: Create Trivy result summary
        if: ${{ always() && inputs.trivy_scan == true }}
        run: |
          python3 - "trivy-${{ matrix.name }}.json" "${{ matrix.name }}" "$IMAGE_NAME" << 'PYEOF'
          import json
          import sys

          scan_file, service, image = sys.argv[1:4]
          cves_by_severity = {
              "critical": set(),
              "high": set(),
              "medium": set(),
              "low": set(),
          }
          finding_values = set()
          scan_error = ""

          try:
              with open(scan_file) as f:
                  data = json.load(f)

              for result in data.get("Results") or []:
                  for vulnerability in result.get("Vulnerabilities") or []:
                      severity = str(vulnerability.get("Severity") or "UNKNOWN").upper()
                      severity_key = severity.lower()
                      cve = str(vulnerability.get("VulnerabilityID") or "").strip()
                      if severity_key in cves_by_severity and cve:
                          cves_by_severity[severity_key].add(cve)

                      finding_values.add((
                          str(vulnerability.get("PkgName") or "").strip(),
                          cve,
                          severity,
                          str(vulnerability.get("InstalledVersion") or "").strip(),
                      ))
          except Exception as error:
              scan_error = str(error)
              print(f"Could not read/parse {scan_file}: {error}")

          counts = {
              severity: len(cves)
              for severity, cves in cves_by_severity.items()
          }
          findings = [
              {
                  "library": library,
                  "cve": cve,
                  "severity": severity,
                  "installed": installed,
              }
              for library, cve, severity, installed in sorted(finding_values)
          ]

          result = {
              "scanner": "Trivy",
              "count_basis": "unique_cves",
              "service": service,
              "image": image,
              **counts,
              "findings": findings,
              "has_critical_or_high": counts["critical"] > 0 or counts["high"] > 0,
              "scan_error": scan_error,
          }

          result_file = f"trivy-result-{service}.json"
          with open(result_file, "w") as f:
              json.dump(result, f, indent=2)
          print(json.dumps(result, indent=2))
          PYEOF

      - name: Upload per-image Trivy result summary
        if: ${{ always() && inputs.trivy_scan == true }}
        uses: actions/upload-artifact@v4
        with:
          name: trivy-result-${{ matrix.name }}
          path: trivy-result-${{ matrix.name }}.json
          retention-days: 2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_BUILD_ROLE_TO_ASSUME }}

      - name: Login to Amazon ECR
        run: |
          REGISTRY_URL="${{ secrets.AWS_ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"
          aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $REGISTRY_URL

      - name: Push Image to ECR
        run: |
          echo "Pushing: $IMAGE_NAME"
          docker push $IMAGE_NAME

  # ──────────────────────────────────────────────
  # Job 3: Twistlock Scan - runs after build/push completes
  # ──────────────────────────────────────────────
  twistlock_scan:
    name: Twistlock Scan - ${{ matrix.name }}
    runs-on:
      group: cbiit-global-runners
      labels: [nonprod-org-runner]
    needs: [prepare, build]
    if: needs.build.result == 'success' && inputs.twistlock_scan == true
    environment: ${{ inputs.environment }}
    env:
      IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
      REGION: "us-east-1"
      TWISTLOCK_URL: "https://twistlock.nci.nih.gov"
      #TWISTLOCK_URL: "http://nciws-p2005-v.nci.nih.gov"
      TWISTLOCK_PATH: "/opt/twistlock/twistcli"
    strategy:
      fail-fast: false
      #max-parallel: 1
      matrix:
        include:
          - name: backend
            ecr_repo: crdc-gen-backend
          - name: frontend
            ecr_repo: crdc-gen-frontend
          - name: interoperation
            ecr_repo: crdc-gen-interoperation
    outputs:
      backend_scan_result: ${{ steps.set_scan_output.outputs.scan_result }}
    steps:
      - name: Set image name
        run: |
          rm -f \
            "scan-${{ matrix.name }}.json" \
            "scan-output-${{ matrix.name }}.log" \
            "scan-table-${{ matrix.name }}.txt" \
            "result-${{ matrix.name }}.json"

          uname -a
          cat /etc/os-release
          systemctl status docker
          echo "IMAGE_NAME=${{ secrets.AWS_ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ matrix.ecr_repo }}:${{ env.IMAGE_TAG }}" >> $GITHUB_ENV

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_BUILD_ROLE_TO_ASSUME }}

      - name: Login to Amazon ECR
        run: |
          REGISTRY_URL="${{ secrets.AWS_ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"
          aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $REGISTRY_URL

      - name: Pull Image from ECR
        run: |
          echo "Pulling: $IMAGE_NAME"
          docker pull $IMAGE_NAME

      - name: Download Twistlock CLI (twistcli) to runner
        run: |
          set -Eeuo pipefail

          TWISTLOCK_PATH="${RUNNER_TEMP}/twistcli"

          curl --fail --silent --show-error --location --insecure -u "${{ secrets.TWISTLOCK_USERNAME }}:${{ secrets.TWISTLOCK_PASSWORD }}" --output "${TWISTLOCK_PATH}" "${TWISTLOCK_URL}/api/v1/util/twistcli"
          test -s "${TWISTLOCK_PATH}"
          chmod 0755 "${TWISTLOCK_PATH}"

          echo "TWISTLOCK_PATH=${TWISTLOCK_PATH}" >> "$GITHUB_ENV"

          echo "Downloaded TwistCLI:"
          ls -lh "${TWISTLOCK_PATH}"
          "${TWISTLOCK_PATH}" --version

          docker image prune --all --force --filter "until=24h"
          #docker image prune --all --force

          df -h
          docker system df

      - name: Run Twistlock Scan
        id: twistlock_scan
        continue-on-error: ${{ matrix.name == 'backend' }}
        run: |
          set -uo pipefail
          SCAN_LOG="scan-output-${{ matrix.name }}.log"
          SCAN_JSON="scan-${{ matrix.name }}.json"

          set +e
          echo "========================================"
          echo "Scanning: $IMAGE_NAME"
          echo "========================================"
          ${TWISTLOCK_PATH} images scan --help | grep disable-symbol-extraction

          ${TWISTLOCK_PATH} images scan \
            --disable-symbol-extraction \
            --address "${TWISTLOCK_URL}" \
            --user "${{ secrets.TWISTLOCK_USERNAME }}" \
            --password "${{ secrets.TWISTLOCK_PASSWORD }}" \
            --output-file "scan-${{ matrix.name }}.json" \
            "$IMAGE_NAME" \
            2>&1 | tee scan-output-${{ matrix.name }}.log

            SCAN_EXIT_CODE=${PIPESTATUS[0]}

          set -e

          {
            echo
            echo "========================================"
            echo "End: $(date --utc --iso-8601=seconds)"
            echo "TwistCLI exit code: $SCAN_EXIT_CODE"
            echo "========================================"
          } | tee -a "$SCAN_LOG"

          echo "Checking Console immediately after scan:"
          POST_SCAN_HTTP_CODE=$(
            curl --silent \
              --show-error \
              --insecure \
              --connect-timeout 10 \
              --max-time 30 \
              --output /dev/null \
              --write-out '%{http_code}' \
              -u "${{ secrets.TWISTLOCK_USERNAME }}:${{ secrets.TWISTLOCK_PASSWORD }}" \
              "${TWISTLOCK_URL}/api/v1/version" \
              || true
          )

          echo "Post-scan Console HTTP status: ${POST_SCAN_HTTP_CODE:-unreachable}" \
            | tee -a "$SCAN_LOG"

          echo "SCAN_EXIT_CODE=$SCAN_EXIT_CODE" >> "$GITHUB_ENV"
          exit "$SCAN_EXIT_CODE"


      - name: Format scan results as table
        id: format_table
        if: always()
        run: |
          python3 - "scan-${{ matrix.name }}.json" "${{ matrix.name }}" << 'PYEOF'
          import json
          import os
          import sys

          scan_file, image_label = sys.argv[1], sys.argv[2]
          gh_output_path = os.environ["GITHUB_OUTPUT"]

          try:
              with open(scan_file) as f:
                  data = json.load(f)
          except Exception as e:
              print(f"Could not read/parse {scan_file}: {e}")
              with open(gh_output_path, "a") as gh_out:
                  gh_out.write("critical_count=0\n")
                  gh_out.write("high_count=0\n")
                  gh_out.write("medium_count=0\n")
                  gh_out.write("low_count=0\n")
                  gh_out.write("cves_json=[]\n")
                  gh_out.write("findings_json=[]\n")
                  gh_out.write("report_available=false\n")
                  gh_out.write("has_critical_or_high=false\n")
              sys.exit(0)

          results = data if isinstance(data, list) else data.get("results", [data])

          rows = []
          sev_counts = {"critical": 0, "high": 0, "medium": 0, "low": 0}

          for result in results:
              vulns = result.get("vulnerabilities") or []
              for v in vulns:
                  sev = (v.get("severity") or "unknown").lower()
                  if sev in sev_counts:
                      sev_counts[sev] += 1
                  rows.append({
                      "package": v.get("packageName", v.get("id", "")),
                      "cve": v.get("cve") or v.get("id", ""),
                      "severity": (v.get("severity") or "").upper(),
                      "status": v.get("status", "fixed" if v.get("fixDate") else "affected"),
                      "installed": v.get("packageVersion", ""),
                      "fixed": v.get("fixedVersion") or v.get("fixDate", "not fixed"),
                  })

          total = len(rows)
          summary = f"Total: {total} (CRITICAL: {sev_counts['critical']}, HIGH: {sev_counts['high']}, MEDIUM: {sev_counts['medium']}, LOW: {sev_counts['low']})"

          print("=" * 100)
          print(f"Twistlock Scan Results: {image_label}")
          print("=" * 100)
          print(summary)
          print()

          if not rows:
              print("No vulnerabilities found.")
          else:
              cols = ["package", "cve", "severity", "status", "installed", "fixed"]
              headers = ["Library", "Vulnerability", "Severity", "Status", "Installed Version", "Fixed Version"]
              widths = [max(len(h), max((len(str(r[c])) for r in rows), default=0)) for h, c in zip(headers, cols)]

              def line(char="-"):
                  return "+" + "+".join(char * (w + 2) for w in widths) + "+"

              def fmt_row(vals):
                  return "| " + " | ".join(str(v).ljust(w) for v, w in zip(vals, widths)) + " |"

              print(line())
              print(fmt_row(headers))
              print(line())
              for r in rows:
                  print(fmt_row([r[c] for c in cols]))
              print(line())

          with open(f"scan-table-{image_label}.txt", "w") as out:
              out.write(summary + "\n")

          cves = sorted({str(row["cve"]).strip() for row in rows if str(row["cve"]).strip()})
          finding_values = sorted({
              (
                  str(row["package"]).strip(),
                  str(row["cve"]).strip(),
                  str(row["severity"]).strip(),
                  str(row["installed"]).strip(),
                  str(row["fixed"]).strip(),
              )
              for row in rows
          })
          findings = [
              {
                  "library": library,
                  "cve": cve,
                  "severity": severity,
                  "installed": installed,
                  "fixed": fixed,
              }
              for library, cve, severity, installed, fixed in finding_values
          ]
          has_critical_or_high = "true" if (sev_counts["critical"] > 0 or sev_counts["high"] > 0) else "false"
          with open(gh_output_path, "a") as gh_out:
              gh_out.write(f"critical_count={sev_counts['critical']}\n")
              gh_out.write(f"high_count={sev_counts['high']}\n")
              gh_out.write(f"medium_count={sev_counts['medium']}\n")
              gh_out.write(f"low_count={sev_counts['low']}\n")
              gh_out.write(f"cves_json={json.dumps(cves)}\n")
              gh_out.write(f"findings_json={json.dumps(findings)}\n")
              gh_out.write("report_available=true\n")
              gh_out.write(f"has_critical_or_high={has_critical_or_high}\n")
          PYEOF

      - name: Write scan result summary file
        if: always()
        run: |
          cat > "result-${{ matrix.name }}.json" << EOF
          {
            "service": "${{ matrix.name }}",
            "image": "${IMAGE_NAME}",
            "critical": ${{ steps.format_table.outputs.critical_count || 0 }},
            "high": ${{ steps.format_table.outputs.high_count || 0 }},
            "medium": ${{ steps.format_table.outputs.medium_count || 0 }},
            "low": ${{ steps.format_table.outputs.low_count || 0 }},
            "cves": ${{ steps.format_table.outputs.cves_json || '[]' }},
            "findings": ${{ steps.format_table.outputs.findings_json || '[]' }},
            "has_critical_or_high": "${{ steps.format_table.outputs.has_critical_or_high || 'false' }}",
            "report_available": ${{ steps.format_table.outputs.report_available || 'false' }}
          }
          EOF
          cat "result-${{ matrix.name }}.json"

      - name: Upload per-image result summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twistlock-result-${{ matrix.name }}
          path: result-${{ matrix.name }}.json
          retention-days: 2

      - name: Set scan result output
        id: set_scan_output
        if: always()
        run: |
          if [ -f "scan-${{ matrix.name }}.json" ]; then
            SCAN_SUMMARY=$(cat "scan-${{ matrix.name }}.json" | tr -d '\n' | tr -d '\r')
          else
            SCAN_SUMMARY="Scan output file not found for ${{ matrix.name }}"
          fi
          {
            echo "scan_result<<EOF"
            echo "$SCAN_SUMMARY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      #- name: Upload scan results as artifact
        #if: always()
        #uses: actions/upload-artifact@v4
        #with:
          #name: twistlock-scan-${{ matrix.name }}
          #path: |
            #scan-${{ matrix.name }}.json
            #scan-output-${{ matrix.name }}.log
            #scan-table-${{ matrix.name }}.txt
          #retention-days: 2


  # ──────────────────────────────────────────────
  # Job 4: Trivy and Twistlock summaries - fail on critical/high from either scan
  # ──────────────────────────────────────────────
  twistlock_summary:
    name: Trivy and Twistlock Scan Summary
    runs-on: ubuntu-latest
    needs: [build, twistlock_scan]
    if: always() && (needs.build.result != 'skipped' || needs.twistlock_scan.result != 'skipped')
    steps:
      - name: Download Trivy per-image result summaries
        if: ${{ inputs.trivy_scan == true }}
        uses: actions/download-artifact@v4
        with:
          pattern: trivy-result-*
          path: trivy-results
          merge-multiple: true

      - name: Download Twistlock per-image result summaries
        if: ${{ inputs.twistlock_scan == true && needs.twistlock_scan.result != 'skipped' }}
        uses: actions/download-artifact@v4
        with:
          pattern: twistlock-result-*
          path: twistlock-results
          merge-multiple: true

      - name: Build Trivy and Twistlock summaries and evaluate pass/fail
        run: |
          python3 - << 'PYEOF'
          import glob
          import json
          import os

          def load_results(pattern):
              rows = []
              for fpath in sorted(glob.glob(pattern)):
                  try:
                      with open(fpath) as f:
                          rows.append(json.load(f))
                  except Exception as error:
                      print(f"Could not read {fpath}: {error}")
              return rows

          def format_finding_value(value, default="None"):
              text = str(value or default).replace("|", "\\|").replace("`", "'")
              return f"`{text}`" if text != "None" else text

          def as_bool(value):
              return value is True or str(value).lower() == "true"

          def result_failed(result):
              return as_bool(result.get("has_critical_or_high", False))

          def report_missing(result):
              report_available = result.get("report_available")
              return report_available is not None and not as_bool(report_available)

          def add_scan_section(lines, scanner, rows):
              lines.append(f"## \U0001F512 {scanner} Scan Results\n")
              if not rows:
                  lines.append(f"No {scanner} scan results were produced.\n")
                  return False, False

              if scanner == "Trivy":
                  lines.append("Severity totals count unique CVE IDs; all affected packages remain listed below.\n")

              lines.append("| Service | Critical | High | Medium | Low | Library | CVEs (Severity) | Installed Version | Status |")
              lines.append("|---|---|---|---|---|---|---|---|---|")
              scanner_vulnerability_failed = False
              scanner_report_missing = False

              for result in rows:
                  crit = result.get("critical", 0)
                  high = result.get("high", 0)
                  med = result.get("medium", 0)
                  low = result.get("low", 0)
                  findings = result.get("findings") or []
                  library_text = "<br>".join(format_finding_value(f.get("library")) for f in findings) if findings else "None"
                  cve_text = "<br>".join(
                      format_finding_value(f"{f.get('cve') or 'Unknown'} ({f.get('severity') or 'UNKNOWN'})")
                      for f in findings
                  ) if findings else "None"
                  installed_text = "<br>".join(format_finding_value(f.get("installed")) for f in findings) if findings else "None"
                  vulnerability_failed = result_failed(result)
                  missing_report = report_missing(result)

                  if vulnerability_failed:
                      scanner_vulnerability_failed = True

                  if missing_report:
                      scanner_report_missing = True
                      status = "\u274C NO VULN REPORT"
                  elif vulnerability_failed:
                      status = "\u274C FAIL"
                  else:
                      status = "\u2705 PASS"

                  lines.append(f"| {result.get('service','?')} | {crit} | {high} | {med} | {low} | {library_text} | {cve_text} | {installed_text} | {status} |")

              lines.append("")
              if scanner_report_missing:
                  lines.append(f"\u274C **No vulnerability reports were generated for one or more {scanner} scans.**\n")
              elif scanner_vulnerability_failed:
                  lines.append(f"\u274C **{scanner} found CRITICAL or HIGH vulnerabilities.**\n")
              else:
                  lines.append(f"\u2705 **{scanner} found no CRITICAL or HIGH vulnerabilities.**\n")
              return scanner_vulnerability_failed, scanner_report_missing

          trivy_rows = load_results("trivy-results/*.json")
          twistlock_rows = load_results("twistlock-results/*.json")

          lines = []
          trivy_vulnerabilities, trivy_missing = add_scan_section(lines, "Trivy", trivy_rows)
          twistlock_vulnerabilities, twistlock_missing = add_scan_section(lines, "Twistlock", twistlock_rows)
          any_fail = trivy_vulnerabilities or twistlock_vulnerabilities or trivy_missing or twistlock_missing

          lines.append("## Combined Security Scan Result\n")
          if any_fail:
              lines.append("\u274C **A vulnerability report is missing, or Trivy/Twistlock found CRITICAL or HIGH vulnerabilities.**")
          else:
              lines.append("\u2705 **No CRITICAL or HIGH vulnerabilities were found by Trivy or Twistlock.**")

          summary_md = "\n".join(lines)
          print(summary_md)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(summary_md + "\n")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"ANY_CRITICAL_OR_HIGH={'true' if any_fail else 'false'}\n")
          PYEOF

      - name: Fail if vulnerability report is missing or critical/high vulnerabilities are found
        if: env.ANY_CRITICAL_OR_HIGH == 'true'
        run: |
          echo "Failing build: a vulnerability report is missing, or Trivy/Twistlock found CRITICAL or HIGH vulnerabilities."
          exit 1

  # ──────────────────────────────────────────────
  # Job 5: Slack notification (always runs)
  # ──────────────────────────────────────────────
  notify:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs: [build, twistlock_scan, twistlock_summary]
    if: always()
    steps:
      - name: Slack Notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        uses: act10ns/slack@87c73aef9f8838eb6feae81589a6b1487a4a9e08  # v1.6.0
        with:
          status: ${{ needs.build.result }}
