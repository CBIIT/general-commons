name: Build Images for GC (new workflow)
permissions:
  contents: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Build from Github Actions
        type: environment
        default: build
      build:
        description: build docker images
        required: true
        type: boolean
        default: true
      trivy_scan:
        description: "Run Trivy Scan"
        required: true
        type: boolean
        default: true
run-name: "Build Docker Images for GC"

jobs:

  # ──────────────────────────────────────────────
  # Job 1: Compute the image tag once, share it
  # ──────────────────────────────────────────────
  prepare:
    name: Prepare Image Tag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set_tag.outputs.image_tag }}
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          submodules: recursive
          clean: true
          fetch-depth: 0

      - name: Extract branch name and set image tag
        id: set_tag
        run: |
          BRANCH_NAME=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
          echo "Current branch is: $BRANCH_NAME"
          git fetch --tags --force --quiet
          #tag=$(git tag -l $BRANCH_NAME* | sort -V | tail -1)
          tag=$(git ls-remote --tags origin "$BRANCH_NAME.*" \
            | awk '{print $2}' \
            | sed 's|refs/tags/||' \
            | sort -V \
            | tail -1)
          echo "Latest git tag: $tag" 
          if [ ! -z "$tag" ]; then
            build_num=$(echo "${tag##*.}")
            build_num=$((build_num+1))
          else
            build_num=1
          fi
          IMAGE_TAG="$BRANCH_NAME.$build_num"
          echo "IMAGE_TAG=$IMAGE_TAG"

          # Tag the commit immediately so the next run always sees it, even if the build fails
          git config user.name "GitHub Actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag $IMAGE_TAG
          git push origin $IMAGE_TAG

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────
  # Job 2: Build + Trivy scan + Push each image in parallel
  # ──────────────────────────────────────────────
  build:
    name: Build, Scan and Push - ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: prepare
    environment: ${{ inputs.environment }}
    env:
      IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
      REGION: "us-east-1"
    strategy:
      fail-fast: false   # let all matrix jobs run even if one fails
      matrix:
        include:
          - name: backend
            ecr_repo: crdc-gen-backend
            dockerfile: backend/Dockerfile
            context: backend
          - name: frontend
            ecr_repo: crdc-gen-frontend
            dockerfile: frontend/Dockerfile
            context: frontend
          - name: interoperation
            ecr_repo: crdc-gen-interoperation
            dockerfile: interoperation/Dockerfile
            context: interoperation

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          submodules: true

      - name: Set image name
        run: |
          echo "IMAGE_NAME=${{ secrets.AWS_ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ matrix.ecr_repo }}:${{ env.IMAGE_TAG }}" >> $GITHUB_ENV

      - name: Build Docker Image
        run: |
          docker build --no-cache \
            -t $IMAGE_NAME \
            -f ${{ matrix.dockerfile }} \
            ${{ matrix.context }}

      - name: Run Trivy Scan
        if: ${{ inputs.trivy_scan == true }}
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          echo "========================================"
          echo "Scanning: $IMAGE_NAME"
          echo "========================================"
          trivy image \
            --exit-code 1 \
            --severity CRITICAL,HIGH \
            --no-progress \
            --format table \
            "$IMAGE_NAME"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_BUILD_ROLE_TO_ASSUME }}

      - name: Login to Amazon ECR
        run: |
          REGISTRY_URL="${{ secrets.AWS_ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"
          aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $REGISTRY_URL

      - name: Push Image to ECR
        run: |
          echo "Pushing: $IMAGE_NAME"
          docker push $IMAGE_NAME

  # ──────────────────────────────────────────────
  # Job 3: Twistlock Scan - runs after build/push completes
  # ──────────────────────────────────────────────
  twistlock_scan:
    name: Twistlock Scan - ${{ matrix.name }}
    runs-on: 
      group: cbiit-global-runners
      labels: [nonprod-org-runner]
    needs: [prepare, build]
    if: needs.build.result == 'success'
    environment: ${{ inputs.environment }}
    env:
      IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
      REGION: "us-east-1"
      TWISTLOCK_URL: "https://twistlock.nci.nih.gov"
      TWISTLOCK_PATH: "/opt/twistlock/twistcli"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            ecr_repo: crdc-gen-backend
          - name: frontend
            ecr_repo: crdc-gen-frontend
          - name: interoperation 
            ecr_repo: crdc-gen-interoperation
    outputs:
      backend_scan_result: ${{ steps.set_scan_output.outputs.scan_result }}
    steps:
      - name: Set image name
        run: |
          uname -a
          cat /etc/os-release
          systemctl status docker
          echo "IMAGE_NAME=${{ secrets.AWS_ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ matrix.ecr_repo }}:${{ env.IMAGE_TAG }}" >> $GITHUB_ENV

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_BUILD_ROLE_TO_ASSUME }}

      - name: Login to Amazon ECR
        run: |
          REGISTRY_URL="${{ secrets.AWS_ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"
          aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $REGISTRY_URL

      - name: Pull Image from ECR
        run: |
          echo "Pulling: $IMAGE_NAME"
          docker pull $IMAGE_NAME

      - name: Download Twistlock CLI (twistcli) to runner
        run: |
          if [ -x "${TWISTLOCK_PATH}" ]; then
            echo "twistcli already present at ${TWISTLOCK_PATH}, checking version:"
            "${TWISTLOCK_PATH}" --version || true
          else
            echo "twistcli not found at ${TWISTLOCK_PATH}, downloading from ${TWISTLOCK_URL}"
            sudo mkdir -p "$(dirname "${TWISTLOCK_PATH}")"

            curl -sSk -u "${{ secrets.TWISTLOCK_USERNAME }}:${{ secrets.TWISTLOCK_PASSWORD }}" --output /tmp/twistcli "${TWISTLOCK_URL}/api/v1/util/twistcli"
            if [ ! -s /tmp/twistcli ]; then
              echo "ERROR: twistcli failed to download (file is empty or missing)"
              exit 1
            fi
            sudo mv /tmp/twistcli "${TWISTLOCK_PATH}"
            sudo chmod +x "${TWISTLOCK_PATH}"
            echo "twistcli downloaded successfully:"
            "${TWISTLOCK_PATH}" --version || true
          fi

      - name: Run Twistlock Scan
        id: twistlock_scan
        run: |
          echo "========================================"
          echo "Scanning: $IMAGE_NAME"
          echo "========================================"
          ${TWISTLOCK_PATH} images scan \
            --address "${TWISTLOCK_URL}" \
            --user "${{ secrets.TWISTLOCK_USERNAME }}" \
            --password "${{ secrets.TWISTLOCK_PASSWORD }}" \
            --output-file "scan-${{ matrix.name }}.json" \
            "$IMAGE_NAME" \
          | tee scan-output-${{ matrix.name }}.log

      - name: Set scan result output
        id: set_scan_output
        if: always()
        run: |
          if [ -f "scan-${{ matrix.name }}.json" ]; then
            SCAN_SUMMARY=$(cat "scan-${{ matrix.name }}.json" | tr -d '\n' | tr -d '\r')
          else
            SCAN_SUMMARY="Scan output file not found for ${{ matrix.name }}"
          fi
          {
            echo "scan_result<<EOF"
            echo "$SCAN_SUMMARY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload scan results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twistlock-scan-${{ matrix.name }}
          path: |
            scan-${{ matrix.name }}.json
            scan-output-${{ matrix.name }}.log
          retention-days: 2 


  # ──────────────────────────────────────────────
  # Job 4: Slack notification (always runs)
  # ──────────────────────────────────────────────
  notify:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs: [build]
    if: always()
    steps:
      - name: Slack Notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        uses: act10ns/slack@87c73aef9f8838eb6feae81589a6b1487a4a9e08  # v1.6.0
        with:
          status: ${{ needs.build.result }}
