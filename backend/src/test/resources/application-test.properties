# Dummy values for Spring tests. Loaded via the "test" profile
# (application-test.properties). Production application.properties stays on
# the classpath for schema paths and other defaults.

# Elasticsearch Filtering
es.filter.enabled = false

# Memgraph (so ConfigurationDAO does not abort the JVM)
memgraph.endpoint = localhost
memgraph.port = 7687
memgraph.user = testuser
memgraph.password = testpass

bento.api.version = test-version
allow.graphql.query = true
allow.graphql.mutation = false
